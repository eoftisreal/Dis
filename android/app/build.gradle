plugins { id 'com.android.application' }

android {
    namespace 'io.github.eoftisreal.dis'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.eoftisreal.dis'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '0.4.4-preview'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            def localPreviewKey = rootProject.file('../.tools/signing/Dis-preview.keystore')
            if (localPreviewKey.exists()) { storeFile localPreviewKey }
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
