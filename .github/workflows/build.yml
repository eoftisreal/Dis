name: Build and verify
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .tools/gradle-8.9
            .tools/gradle-home/caches
            .tools/nuget-packages
            .tools/signing
            .tools/vdd-25.7.23.zip
            ~/.m2/repository/org/robolectric
          key: dis-build-v4-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'src/**/*.csproj', 'tools/build-common.ps1') }}
          restore-keys: dis-build-v4-${{ runner.os }}-
      - name: Install Qt and independent codec verifier
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0 av==16.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt" -m qtshadertools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test Android, Qt desktop and single installer
        shell: pwsh
        run: |
          & tools/build-all.ps1 -QtRoot "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
      - name: Independently decode the encoder smoke stream
        shell: pwsh
        run: |
          python tools/verify_h264.py artifacts/native-smoke.h264
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real virtual monitor and portrait mode
        shell: pwsh
        run: |
          Expand-Archive artifacts/windows/driver/vdd-25.7.23.zip artifacts/vdd-check
          $catalog = Resolve-Path artifacts/vdd-check/VirtualDisplayDriver/mttvdd.cat
          if ((Get-AuthenticodeSignature $catalog).Status -ne 'Valid') { throw 'Driver catalog signature is not trusted' }
          # Only this disposable CI VM simulates accepting the publisher prompt. The app never imports certificates.
          $certificates = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          $certificates.Import([IO.File]::ReadAllBytes($catalog))
          $publisher = $certificates | Where-Object { $_.Subject -match 'CN=SignPath Foundation' } | Select-Object -First 1
          if (-not $publisher) { throw 'Expected signed driver publisher was not found' }
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher','LocalMachine')
          $store.Open('ReadWrite')
          try {
            $store.Add($publisher)
            $process = Start-Process artifacts/windows/Dis.Engine.exe -ArgumentList '--display-smoke' -WindowStyle Hidden -Wait -PassThru
            Get-Content artifacts/display-smoke.json
            if ($process.ExitCode -ne 0) { throw 'Virtual display or orientation smoke test failed' }
            python tools/verify_h264.py artifacts/capture-smoke.h264
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { $store.Remove($publisher); $store.Close() }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dis-Diagnostics
          path: |
            artifacts/logs/
            artifacts/display-smoke.json
            artifacts/capture-probe.jpg
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Dis-Setup
          path: artifacts/Dis-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Dis-Complete-Preview
          path: artifacts/Dis-Complete.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Dis-Android-preview
          path: artifacts/android/Dis.apk
          if-no-files-found: error
